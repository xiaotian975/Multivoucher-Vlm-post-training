[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "multivoucher-audit"
version = "0.0.0"
description = "Multi-image enterprise reimbursement audit post-training project skeleton."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "MultiVoucher-Audit contributors" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
