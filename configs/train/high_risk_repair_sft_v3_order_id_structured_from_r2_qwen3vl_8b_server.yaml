seed: 42
model:
  model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
  local_model_dir: models/Qwen3-VL-8B-Instruct
  dtype: auto
  device_map: auto
  trust_remote_code: true
data:
  train_file: docs/experiments/phase09_order_id_structured_repair_v3/repair_sft_v3_order_id_structured_mix.jsonl
  val_file: data/mv_audit/sft_main/val.jsonl
  raw_cases_dir: data/mv_audit/raw_cases/main
  annotations_dir: data/mv_audit/annotations_main
  decode_dev_file: docs/experiments/phase08_loss_ablation_two_candidate_decode_20260812_5gpu_ablation_r3/ground_truth/dpo_v2_baseline/train_decode_dev.jsonl
  output_schema: configs/schema/output_schema.json
training:
  base_adapter_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r2_order_id_from_r1_existing_images
  output_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r3_order_id_structured_from_r2
  learning_rate: 2.0e-05
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  eval_strategy: 'no'
  save_strategy: 'no'
  save_total_limit: 2
  report_to: []
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
inference:
  predictions_dir: outputs/predictions/phase09_repair_sft_r3_order_id_structured_train_decode_dev
  ground_truth_dir: outputs/eval_sets/phase09_repair_sft_r3_order_id_structured
  sample_manifest_dir: ''
  train_decode_dev_file: docs/experiments/phase08_loss_ablation_two_candidate_decode_20260812_5gpu_ablation_r3/ground_truth/dpo_v2_baseline/train_decode_dev.jsonl
  train_decode_dev_ground_truth_dir: outputs/eval_sets/phase09_repair_sft_r3_order_id_structured_train_decode_dev
  sft_adapter_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r3_order_id_structured_from_r2
  few_shot_count: 2
  max_new_tokens: 1536
  temperature: 0.0
  top_p: 0.9
  image_max_pixels: 262144
  flush_every: 1
  schema_guard: true
