model:
  model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
  local_model_dir: models/Qwen3-VL-8B-Instruct
  dtype: auto
  device_map: auto
  trust_remote_code: true

data:
  train_file: data/mv_audit/sft_main/train_existing_images.jsonl
  val_file: data/mv_audit/sft_main/val_existing_images.jsonl
  raw_cases_dir: data/mv_audit/raw_cases/main
  annotations_dir: data/mv_audit/annotations_main
  decode_dev_file: data/mv_audit/dpo_v2/train_decode_dev.jsonl
  output_schema: configs/schema/output_schema.json

training:
  output_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r3_order_id_structured_from_r2

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

inference:
  predictions_dir: outputs/predictions/repair_sft_r3_sample500_diagnostic
  ground_truth_dir: data/mv_audit/eval_sets_phase07_sample500
  sample_manifest_dir: data/mv_audit/eval_sets_phase07_sample500/manifests
  train_decode_dev_file: data/mv_audit/dpo_v2/train_decode_dev.jsonl
  train_decode_dev_ground_truth_dir: outputs/eval_sets/phase09_repair_sft_r3_order_id_structured_train_decode_dev
  sft_adapter_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r3_order_id_structured_from_r2
  few_shot_count: 2
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 0.9
  image_max_pixels: 262144
  flush_every: 1
