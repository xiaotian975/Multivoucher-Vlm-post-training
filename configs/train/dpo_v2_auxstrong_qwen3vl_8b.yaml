seed: 42

model:
  model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
  local_model_dir: models/Qwen3-VL-8B-Instruct
  sft_checkpoint_dir: outputs/checkpoints/sft/qwen3vl_8b_lora_existing_epoch1
  dtype: auto
  device_map: auto
  trust_remote_code: true

data:
  train_file: data/mv_audit/dpo_v2/pairs_train.jsonl
  holdout_file: data/mv_audit/dpo_v2/pairs_holdout.jsonl
  decode_dev_file: data/mv_audit/dpo_v2/train_decode_dev.jsonl
  pair_report: data/mv_audit/dpo_v2/pair_report.json
  output_schema: configs/schema/output_schema.json
  require_existing_images: true
  train_only: true

training:
  output_dir: outputs/checkpoints/dpo/qwen3vl_8b_dpo_v2_auxstrong
  metrics_output: outputs/eval_reports/phase08_dpo_v2_auxstrong/dpo_v2_reward_audit.json
  learning_rate: 1.0e-6
  num_train_epochs: 1
  max_train_steps: 40
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  loss_type: dpo
  beta: 0.1
  lambda_sft: 0.2
  max_weight: 3.0
  early_stop_metric: train_decode_dev_high_risk_miss_rate
  bf16: true
  logging_steps: 5
  eval_steps: 10
  max_holdout_examples: 128
  save_steps: 20
  save_total_limit: 3
  report_to: []
