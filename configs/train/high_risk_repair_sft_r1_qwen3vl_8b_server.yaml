seed: 42

model:
  model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
  local_model_dir: models/Qwen3-VL-8B-Instruct
  dtype: auto
  device_map: auto
  trust_remote_code: true

data:
  train_file: docs/experiments/phase08_high_risk_repair_pack_20260813/repair_sft_train_mix.jsonl
  val_file: data/mv_audit/sft_main/val.jsonl
  raw_cases_dir: data/mv_audit/raw_cases/main
  annotations_dir: data/mv_audit/annotations_main
  decode_dev_file: docs/experiments/phase08_loss_ablation_two_candidate_decode_20260812_5gpu_ablation_r3/ground_truth/dpo_v2_baseline/train_decode_dev.jsonl
  output_schema: configs/schema/output_schema.json

training:
  output_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r1
  learning_rate: 5.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  eval_strategy: steps
  save_strategy: steps
  save_total_limit: 2
  report_to: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

inference:
  predictions_dir: outputs/predictions/phase08_high_risk_repair_train_decode_dev
  ground_truth_dir: data/mv_audit/eval_sets_phase07_sample500
  sample_manifest_dir: data/mv_audit/eval_sets_phase07_sample500/manifests
  train_decode_dev_file: docs/experiments/phase08_loss_ablation_two_candidate_decode_20260812_5gpu_ablation_r3/ground_truth/dpo_v2_baseline/train_decode_dev.jsonl
  train_decode_dev_ground_truth_dir: outputs/eval_sets/phase08_high_risk_repair_train_decode_dev/repair_sft_r1
  sft_adapter_dir: outputs/checkpoints/sft/qwen3vl_8b_high_risk_repair_r1
  few_shot_count: 2
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 0.9
  image_max_pixels: 262144
  flush_every: 1
