seed: 42

model:
  model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
  local_model_dir: models/Qwen3-VL-8B-Instruct
  dpo_checkpoint_dir: outputs/checkpoints/dpo/qwen3vl_8b_dpo_from_existing_epoch1
  dtype: auto
  device_map: auto
  trust_remote_code: true

data:
  train_file: data/mv_audit/grpo_main/prompts_train.jsonl
  output_schema: configs/schema/output_schema.json
  require_existing_images: true

training:
  output_dir: outputs/checkpoints/grpo/qwen3vl_8b_grpo_from_dpo_existing_epoch1
  metrics_output: outputs/eval_reports/phase08/grpo_reward_audit.json
  learning_rate: 1.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  num_generations: 4
  max_completion_length: 512
  temperature: 0.7
  top_p: 0.9
  kl_beta: 0.0
  scale_rewards: false
  bf16: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  report_to: []

route_guard:
  decision_file: docs/experiments/phase09_repair_v4/rl_decision.json
  required_status: READY_FOR_RL
  require_allow_rl: true
  first_formal_stage: compatibility_smoke
